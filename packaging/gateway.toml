# The QDP gateway's configuration: edit it for your organization, then start
# the service. `qdp-gateway check` tests it and the directory account, and
# `qdp-gateway login USER [HOST]` a user's sign-in. Every setting is described
# in the gateway's documentation.

# The name users see when signing in.
name = "Example Corp"
# Where it listens: UDP port 443, which networks allowing HTTP/3 let through.
listen = "0.0.0.0:443"

[directory]
# The organization's directory, over TLS: ldaps://, or ldap:// with
# starttls = true.
url = "ldaps://dc1.corp.example.com"
# The account the gateway finds users with, and the file holding its
# password, which only the gateway may read: here, one beside this file.
bind_dn = "CN=qdp-gateway,OU=Service Accounts,DC=corp,DC=example,DC=com"
bind_password_file = "directory-password"
base_dn = "DC=corp,DC=example,DC=com"
# For OpenLDAP rather than Active Directory:
# user_filter = "(&(objectClass=inetOrgPerson)(uid={user}))"
# name_attribute = "uid"

[totp]
# Who enrolls TOTP secrets. "first-login": a user without one signs in with
# their domain password, is shown a QR code for their authenticator app, such
# as Google Authenticator, Microsoft Authenticator or Authy, and types its
# first code; from then on every sign-in asks for a code after the password.
# "admin-only": only `qdp-gateway totp enroll USER` enrolls, for organizations
# that will not let a password alone choose the second factor.
enrollment = "first-login"

[assertions]
# The groups hosts are told users are in.
groups = ["QDP Users"]
# The gateway learns the key of each host it opens that is not listed with
# its pin, by a handshake with it inside the network, to vouch for users to
# it; false vouches only for hosts listed with their pins.
# learn_host_keys = true

# Hosts users may open by their names inside the network, such as
# desk-12.desktops.corp.example.com. Hosts need only trust the gateway's key,
# the same on every host: `qdp serve --gateway-key KEY`, with the key
# `qdp-gateway keys` prints.
[[route]]
names = ["*.desktops.corp.example.com"]
networks = ["10.20.0.0/16"]
groups = ["QDP Users"]

# Hosts listed to users by ID, optionally with the pin `qdp pin` prints on
# each, which the gateway then verifies them by instead of learning it.
# [[host]]
# id = "build-01"
# name = "Build machine"
# address = "10.0.4.20:4433"
# groups = ["QDP Users"]
