# Builds the Apple apps: the Rust core as an XCFramework, then the Mac app
# and the iPhone and iPad app with Xcode. CI calls it for every change
# merged into main; it can also be started by hand on any branch, which is
# how changes to the apps are checked before they merge.
name: Apple

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  apple:
    name: Apple apps
    runs-on: macos-latest
    env:
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
          sw_vers

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim --target aarch64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: apple

      - name: Build the core
        run: ./apple/build-core.sh

      - name: Generate the Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      # Releases are signed with the Developer ID and notarized; runs
      # without the secrets docs/releasing.md lists sign ad hoc.
      - name: Check a release can be signed
        if: github.event_name == 'push' && env.HAS_DEVELOPER_ID != 'true'
        run: |
          echo "::error::Releases need the Apple secrets docs/releasing.md lists."
          exit 1

      - name: Import the Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: packaging/macos/import-certificate.sh

      - name: Build the Mac app
        working-directory: apple
        run: |
          xcodebuild -project QDP.xcodeproj -scheme QDP-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          ditto build/Build/Products/Release/QDP.app "build/Quick Desktop.app"

      - name: Sign and notarize the Mac app
        if: env.HAS_DEVELOPER_ID == 'true'
        working-directory: apple
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements Generated/macOS.entitlements \
            --sign "Developer ID Application" "build/Quick Desktop.app"
          ../packaging/macos/notarize.sh "build/Quick Desktop.app"

      - name: Package the Mac app
        working-directory: apple
        run: ditto -c -k --keepParent "build/Quick Desktop.app" ../qdp-macos-app.zip

      - name: Build the iPhone and iPad app
        working-directory: apple
        # Unsigned: sideloading tools sign it with the user's own account,
        # and the App Store build will be signed with the project's.
        run: |
          xcodebuild -project QDP.xcodeproj -scheme QDP-iOS -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QDP.app Payload/
          zip -qry ../qdp-ios-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: qdp-apple
          path: |
            qdp-macos-app.zip
            qdp-ios-unsigned.ipa
          if-no-files-found: error
