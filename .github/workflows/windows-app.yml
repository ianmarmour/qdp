# Builds the Windows app: the Rust core as qdp_windows.dll, then the WinUI 3
# app around it, self-contained, zipped. CI calls it for every change merged
# into main; it can also be started by hand on any branch, which is how
# changes to the app are checked before they merge.
name: Windows app

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows-app:
    name: Windows app
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # NASM for the codecs' assembly.
      - uses: ilammy/setup-nasm@v1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the app
        shell: pwsh
        run: ./windows/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: qdp-windows-app
          path: qdp-windows-app-x64.zip
          if-no-files-found: error
