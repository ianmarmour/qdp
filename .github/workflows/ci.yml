# Checks every change merged into main on Linux, Windows and macOS, builds
# the qdp command for each, the Android, Apple and Windows apps, and publishes them all as a
# GitHub release once every job passed: a numbered build for each change
# merged into main, and a version for each tag such as v0.2.0. Pull requests
# are not checked here, so that merging never waits for it; a run can be
# started on any branch by hand, which builds without releasing.
#
# Runs started by hand check only what the branch changes, as Windows and
# macOS runners cost two and ten times Linux's minutes: Linux always, and the
# Windows, Windows app, macOS, Apple and Android jobs only when the branch
# touches their code or the build itself. They skip release builds and
# packages, and the macOS tests, which main's runs keep.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer run of a branch, main included, replaces its older one, whose
  # build the newer commit supersedes, so that merges in quick succession
  # are built once. A tag's release always finishes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the code is checked with, so that a new Rust release's
  # lints do not fail builds of unchanged code.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.areas.outputs.windows }}
      windows-app: ${{ steps.areas.outputs.windows-app }}
      apple: ${{ steps.areas.outputs.apple }}
      android: ${{ steps.areas.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Main and tags build everything. A branch builds a platform when it
      # changes the build, a file of that platform's, or a line of shared
      # code that names the platform.
      - name: Find the platforms the change touches
        id: areas
        run: |
          areas="windows windows-app apple android"
          # Writes `value` for every platform.
          all() {
            for area in $areas; do echo "$area=$1" >> "$GITHUB_OUTPUT"; done
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            all true
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          files=$(git diff --name-only "$base" HEAD)
          lines=$(git diff --unified=0 "$base" HEAD | grep -E '^[+-][^+-]' || true)
          manifests=$(git diff --unified=0 "$base" HEAD -- '*Cargo.toml' | grep -E '^[+-][^+-]' || true)
          # The lock file and this workflow concern every platform, and so do the
          # manifests, unless all they change is Windows' dependencies.
          if printf '%s\n' "$files" | grep -Eq '^(Cargo\.lock|\.github/workflows/ci\.yml)$' \
            || printf '%s\n' "$manifests" | grep -vE 'windows|Win32_' | grep -q .; then
            all true
            exit 0
          fi
          app='^(windows/|crates/qdp-windows/|\.github/workflows/windows-app\.yml)'
          declare -A file_patterns=(
            [windows]="$app|/win32/|/d3d11va/|/nvenc/|Cargo\.toml$"
            [windows-app]="$app"
            [apple]='^(apple/|crates/qdp-apple/|\.github/workflows/apple\.yml)|/macos/|metal_video|videotoolbox'
            [android]='^(android/|crates/qdp-android/)|mediacodec'
          )
          # Lines of shared code that name a platform; the Windows app has none.
          declare -A line_patterns=(
            [windows]='cfg\((all\(|any\()?windows|target_os = "windows"|win32::'
            [apple]='target_os = "(macos|ios)"|macos::'
            [android]='target_os = "android"'
          )
          for area in $areas; do
            touched=false
            if printf '%s\n' "$files" | grep -Eq "${file_patterns[$area]}"; then
              touched=true
            elif [ -n "${line_patterns[$area]:-}" ] \
              && printf '%s\n' "$lines" | grep -Eq "${line_patterns[$area]}"; then
              touched=true
            fi
            echo "$area=$touched" >> "$GITHUB_OUTPUT"
          done

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        # NASM for the codecs' assembly; PipeWire for screen capture and
        # audio, whose bindings libclang generates; libudev for gamepads;
        # GTK 4 and libadwaita for the Linux app.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm pkg-config clang libclang-dev libpipewire-0.3-dev libudev-dev \
            libgtk-4-dev libadwaita-1-dev

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the qdp command
        if: github.event_name == 'push'
        run: cargo build --release --locked -p qdp-cli

      - name: Package
        if: github.event_name == 'push'
        run: tar -czf qdp-linux-x86_64.tar.gz -C target/release qdp

      - name: Package as an RPM
        if: github.event_name == 'push'
        # A version tag is the version's first release; a build of main is
        # numbered by its run, so that each upgrades the last.
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          if [ "$GITHUB_REF_TYPE" = tag ]; then release=1; else release="$GITHUB_RUN_NUMBER"; fi
          packaging/linux/build-rpm.sh target/release/qdp "$release" qdp-linux-x86_64.rpm

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: qdp-linux-x86_64
          path: |
            qdp-linux-x86_64.tar.gz
            qdp-linux-x86_64.rpm
          if-no-files-found: error

      - name: Build and package the Linux app
        if: github.event_name == 'push'
        # The tarball is laid out as the app installs, under a prefix:
        # extracting it into ~/.local installs it for one user.
        run: |
          cargo build --release --locked -p qdp-gtk
          packaging/linux/stage-gtk.sh target/release/qdp-gtk qdp-gtk-stage
          tar -czf qdp-gtk-linux-x86_64.tar.gz -C qdp-gtk-stage bin share
          if [ "$GITHUB_REF_TYPE" = tag ]; then release=1; else release="$GITHUB_RUN_NUMBER"; fi
          packaging/linux/build-gtk-rpm.sh target/release/qdp-gtk "$release" qdp-gtk-linux-x86_64.rpm

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: qdp-gtk-linux-x86_64
          path: |
            qdp-gtk-linux-x86_64.tar.gz
            qdp-gtk-linux-x86_64.rpm
          if-no-files-found: error

      - name: Build and package the gateway
        if: github.event_name == 'push'
        run: |
          cargo build --release --locked -p qdp-gateway
          tar -czf qdp-gateway-linux-x86_64.tar.gz -C target/release qdp-gateway
          if [ "$GITHUB_REF_TYPE" = tag ]; then release=1; else release="$GITHUB_RUN_NUMBER"; fi
          packaging/linux/build-gateway-rpm.sh target/release/qdp-gateway "$release" \
            qdp-gateway-linux-x86_64.rpm

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: qdp-gateway-linux-x86_64
          path: |
            qdp-gateway-linux-x86_64.tar.gz
            qdp-gateway-linux-x86_64.rpm
          if-no-files-found: error

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # NASM for the codecs' assembly.
      - uses: ilammy/setup-nasm@v1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The streaming tests encode, send and decode video and audio in real
      # time, a host and a client each; run together on a Windows runner they
      # fall behind, as audio_flows_both_ways once did, hearing its tone
      # slowed, so they run one at a time.
      - name: Tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build the qdp command
        if: github.event_name == 'push'
        run: cargo build --release --locked -p qdp-cli

      - name: Package
        if: github.event_name == 'push'
        run: 7z a qdp-windows-x86_64.zip ./target/release/qdp.exe

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: qdp-windows-x86_64
          path: qdp-windows-x86_64.zip
          if-no-files-found: error

      - name: Build and package the gateway
        if: github.event_name == 'push'
        run: |
          cargo build --release --locked -p qdp-gateway
          7z a qdp-gateway-windows-x86_64.zip ./target/release/qdp-gateway.exe

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: qdp-gateway-windows-x86_64
          path: qdp-gateway-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The streaming tests encode, send and decode video and audio in real
      # time, a host and a client each; macOS runners have three processors,
      # too few to run even two at once and keep time, so they run one at a
      # time.
      - name: Tests
        if: github.event_name == 'push'
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build the qdp command
        if: github.event_name == 'push'
        run: cargo build --release --locked -p qdp-cli

      - name: Package
        if: github.event_name == 'push'
        run: tar -czf qdp-macos-arm64.tar.gz -C target/release qdp

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: qdp-macos-arm64
          path: qdp-macos-arm64.tar.gz
          if-no-files-found: error

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy \
            --target aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Without the signing secrets, builds are signed with Gradle's debug
      # key. Keeping that key between runs lets each build install over the
      # last until the secrets are set, as long as the cache keeps it.
      - name: Keep the debug signing key
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Clippy for Android
        run: |
          . android/ndk-env.sh
          cargo clippy --target aarch64-linux-android --locked -p qdp-android --all-targets -- -D warnings

      - name: Build the app
        working-directory: android
        # With the signing secrets set, every build is signed with the same
        # key, so that each installs over the last; without them, builds are
        # signed with the debug key kept above.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QDP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QDP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QDP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QDP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export QDP_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export QDP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -n 1)
            export QDP_VERSION_NAME="$version-ci.$GITHUB_RUN_NUMBER"
          fi
          ./gradlew assembleRelease lintRelease
          mv app/build/outputs/apk/release/app-release.apk ../qdp-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qdp-android-arm64
          path: qdp-android-arm64.apk
          if-no-files-found: error

  apple:
    name: Apple
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    uses: ./.github/workflows/apple.yml

  windows-app:
    name: Windows app
    needs: changes
    if: needs.changes.outputs.windows-app == 'true'
    uses: ./.github/workflows/windows-app.yml

  release:
    name: Release
    # Every change merged into main and every version tag is released once
    # all the builds passed; runs started by hand are not.
    if: github.event_name == 'push'
    needs: [linux, windows, macos, android, apple, windows-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # How many numbered builds are kept; versions are all kept.
      KEPT_BUILDS: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: qdp-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            title="QDP ${GITHUB_REF_NAME#v}"
          else
            tag="build-$GITHUB_RUN_NUMBER"
            title="QDP $version, build $GITHUB_RUN_NUMBER"
          fi
          cat > notes.md <<NOTES
          | Platform | Download |
          |---|---|
          | Windows app (x86-64, Windows 10 or later) | \`qdp-windows-app-x64.zip\` |
          | Android (64-bit ARM, Android 10 or later) | \`qdp-android-arm64.apk\` |
          | Mac app (Apple silicon, macOS 26 or later) | \`qdp-macos-app.zip\` |
          | iPhone and iPad app (iOS 26 or later, unsigned, for sideloading) | \`qdp-ios-unsigned.ipa\` |
          | Linux (x86-64) | \`qdp-linux-x86_64.tar.gz\` |
          | Linux RPM (x86-64; Fedora 40 or later, openSUSE Tumbleweed) | \`qdp-linux-x86_64.rpm\` |
          | Linux app (x86-64; GTK 4.14 and libadwaita 1.5 or later) | \`qdp-gtk-linux-x86_64.tar.gz\` |
          | Linux app RPM (x86-64; Fedora 40 or later; needs the qdp RPM) | \`qdp-gtk-linux-x86_64.rpm\` |
          | macOS (Apple silicon) | \`qdp-macos-arm64.tar.gz\` |
          | Windows (x86-64) | \`qdp-windows-x86_64.zip\` |
          | Gateway for Linux (x86-64) | \`qdp-gateway-linux-x86_64.tar.gz\` |
          | Gateway RPM (x86-64; Fedora 40 or later, RHEL 9 or later) | \`qdp-gateway-linux-x86_64.rpm\` |
          | Gateway for Windows (x86-64; Windows Server 2019 or later) | \`qdp-gateway-windows-x86_64.zip\` |

          The newest build is always at
          \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/FILE\`.
          The Mac app and \`qdp\` are not notarized yet: open the app once from
          Privacy & Security settings, and run \`xattr -d com.apple.quarantine qdp\`
          before \`qdp\`.
          NOTES
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file notes.md --generate-notes

      - name: Remove old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^build-[0-9]*$' | sort -t- -k2 -n -r | tail -n +$((KEPT_BUILDS + 1)) \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
