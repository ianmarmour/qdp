# Checks every change merged into main on Linux, builds the qdp command for
# Linux and the Android app, and publishes both as a GitHub release when a
# version tag such as v0.2.0 is pushed. Pull requests are not checked here,
# so that merging never waits for it; a run can be started on any branch by
# hand.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit to main, and every tag, is built.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The toolchain the code is checked with, so that a new Rust release's
  # lints do not fail builds of unchanged code.
  RUST_TOOLCHAIN: 1.97.0

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        # NASM for the codecs' assembly; PipeWire for screen capture and
        # audio, whose bindings libclang generates; libudev for gamepads.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm pkg-config clang libclang-dev libpipewire-0.3-dev libudev-dev

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the qdp command
        run: cargo build --release --locked -p qdp-cli

      - name: Package
        run: tar -czf qdp-linux-x86_64.tar.gz -C target/release qdp

      - uses: actions/upload-artifact@v4
        with:
          name: qdp-linux-x86_64
          path: qdp-linux-x86_64.tar.gz
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy \
            --target aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clippy for Android
        run: |
          . android/ndk-env.sh
          cargo clippy --target aarch64-linux-android --locked -p qdp-android --all-targets -- -D warnings

      - name: Build the app
        working-directory: android
        # With the signing secrets set, every build is signed with the same
        # key, so that each installs over the last; without them, builds are
        # signed with a throwaway debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QDP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QDP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QDP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QDP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export QDP_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export QDP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -n 1)
            export QDP_VERSION_NAME="$version-ci.$GITHUB_RUN_NUMBER"
          fi
          ./gradlew assembleRelease lintRelease
          mv app/build/outputs/apk/release/app-release.apk ../qdp-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: qdp-android-arm64
          path: qdp-android-arm64.apk
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
