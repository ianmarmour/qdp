[workspace]
resolver = "3"
members = [
    "crates/qdp",
    "crates/qdp-cli",
    "crates/qdp-codec",
    "crates/qdp-desktop",
    "crates/qdp-quic",
    "crates/qdp-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/ianmarmour/qdp"

[workspace.dependencies]
# The system clipboard on Linux, macOS and Windows.
arboard = { version = "3.7.0", default-features = false }
# The ScreenCast portal, for screen capture on Linux.
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "tokio"] }
bytes = { version = "1.10", default-features = false, features = ["std"] }
# Audio devices on macOS and Windows.
cpal = { version = "0.18.2", default-features = false }
# Gamepads on Linux, macOS and Windows, for clients. On Linux it needs
# libudev's development files.
gilrs = { version = "0.11.2", default-features = false, features = ["wgi"] }
libc = { version = "0.2.172", default-features = false }
# Apple's frameworks, for hardware video decoding on macOS.
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "0.6.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSCursor", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSView", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSObject", "NSString", "NSRunLoop"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLSampler", "MTLTexture", "MTLTypes"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CADisplayLink", "CAFrameRateRange", "CALayer", "CAMetalLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "VTUtilities", "objc2-core-media", "objc2-core-video"] }
qdp = { path = "crates/qdp" }
qdp-codec = { path = "crates/qdp-codec" }
qdp-desktop = { path = "crates/qdp-desktop", default-features = false }
qdp-quic = { path = "crates/qdp-quic" }
qdp-runtime = { path = "crates/qdp-runtime" }
# The X11 and Wayland clipboards, to find content password managers mark
# secret, which arboard does not report.
wl-clipboard-rs = { version = "0.9.3", default-features = false }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "unstable"] }
# Generates KWin's display settings protocols, which the host changes to the
# client's display, from their files.
wayland-scanner = { version = "0.31.11", default-features = false }
# The flag sets those generated protocols declare.
bitflags = { version = "2.13.2", default-features = false }
# The display settings of wlroots compositors and others sharing their
# protocol, which the host changes to the client's display.
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = ["client"] }
x11rb = { version = "0.13", default-features = false }
# PipeWire, which delivers captured screens on Linux.
pipewire = { version = "0.10.1", default-features = false, features = ["v0_3_49"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rav1d = { version = "1.1.0", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
rav1e = { version = "0.8.1", default-features = false, features = ["asm", "threading"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# Opus audio, in pure Rust. It decodes bit-exactly as libopus does and
# interoperates with it both ways.
rusty-opus = { version = "1.0.2", default-features = false }
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
# Software drawing into the window; X11 and Wayland libraries are loaded at
# run time, so building needs none of them.
softbuffer = { version = "0.4.8", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "x11-dlopen"] }
thiserror = { version = "2.0.17", default-features = false }
tokio = { version = "1.47", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "fmt", "std"] }
unicode-normalization = { version = "0.1.24", default-features = false }
# Windows' own interfaces, for screen capture and input on Windows hosts.
windows = { version = "0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Shutdown", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Client-side decorations (wayland-csd-adwaita) give the window a title bar on
# GNOME, which draws none for Wayland clients.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-csd-adwaita", "wayland-dlopen", "x11"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

# The codecs are far too slow unoptimized, even for development and tests, so
# they are optimized in every profile. Most of rav1e is generic over the pixel
# type and is compiled where qdp-codec instantiates it, so qdp-codec is
# optimized too; the other QDP crates stay quick to build.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.qdp-codec]
opt-level = 3

# rav1d checks its internal memory accesses at run time when debug assertions
# are on, which makes decoding about a thousand times slower; the codecs are
# tested upstream, so these checks are off for them.
[profile.dev.package.rav1d]
debug-assertions = false
overflow-checks = false

[profile.dev.package.rav1e]
debug-assertions = false
overflow-checks = false

# rav1e comes from a fork carrying one patch: it accepts an RDO lookahead of
# zero frames in low-latency mode, so each frame is encoded as soon as it is
# received rather than four frames later. The patch is the single commit on
# the fork's qdp-zero-lookahead branch, on top of the commit rav1e 0.8.1 was
# published from. Remove this entry once rav1e accepts an equivalent change.
[patch.crates-io]
rav1e = { git = "https://github.com/ianmarmour/rav1e", rev = "9cedec14a47010f0e078640707a6a0403abfa4de" }
# rav1d comes from its repository at the v1.1.0 tag, the commit the crates.io
# release was published from, because the release leaves out every header file,
# including src/arm/asm-offsets.h, which its 64-bit Arm assembly needs; builds on
# Apple Silicon and other Arm machines fail without it. Remove this entry once a
# release includes the header.
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "782dab2135ea64a057c097088a13eb8ed3cc3320" }
