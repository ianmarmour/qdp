[workspace]
resolver = "3"
members = ["crates/qdp", "crates/qdp-codec", "crates/qdp-quic"]
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/ianmarmour/qdp"

[workspace.dependencies]
bytes = { version = "1.10", default-features = false, features = ["std"] }
libc = { version = "0.2.172", default-features = false }
qdp = { path = "crates/qdp" }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rav1d = { version = "1.1.0", default-features = false, features = ["asm", "bitdepth_8", "bitdepth_16"] }
rav1e = { version = "0.8.1", default-features = false, features = ["asm", "threading"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
thiserror = { version = "2.0.17", default-features = false }
tokio = { version = "1.47", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
unicode-normalization = { version = "0.1.24", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"

# rav1e is vendored with a patch that removes its lookahead delay in
# low-latency mode; see third_party/README.md.
[patch.crates-io]
rav1e = { path = "third_party/rav1e" }
