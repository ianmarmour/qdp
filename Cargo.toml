[workspace]
resolver = "3"
members = ["crates/qdp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/ianmarmour/qdp"

[workspace.dependencies]
thiserror = { version = "2.0.17", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
