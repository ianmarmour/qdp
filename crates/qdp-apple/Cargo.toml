[package]
name = "qdp-apple"
description = "The Apple apps' core of Quick Desktop Protocol (QDP): sessions with a host, shown with Metal, behind a C interface Swift calls"
readme = "README.md"
keywords = ["remote-desktop", "ios", "macos", "streaming"]
categories = ["network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The apps' static library is built with `cargo rustc --crate-type
# staticlib` (apple/build-core.sh), into an XCFramework with include/.

[dependencies]
qdp.workspace = true
qdp-app.workspace = true
qdp-codec.workspace = true
qdp-runtime.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
qdp-desktop = { workspace = true, features = ["audio"] }
qdp-quic.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
