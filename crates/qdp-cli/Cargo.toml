[package]
name = "qdp-cli"
description = "The qdp command: serve a desktop or connect to one with the Quick Desktop Protocol (QDP)"
readme = "README.md"
keywords = ["remote-desktop", "game-streaming", "low-latency"]
categories = ["command-line-utilities", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qdp"
path = "src/main.rs"
# The library crate is also called qdp; documenting both would collide.
doc = false

[features]
default = ["audio", "discovery", "gamepad", "notifications", "screen-capture", "window"]
# Plays and captures sound; on Linux it needs PipeWire's development files.
audio = ["qdp-desktop/audio"]
# Advertises hosts on the local network; on Linux through Avahi.
discovery = ["qdp-desktop/discovery"]
# Captures the client's gamepads; on Linux it needs libudev's development
# files.
gamepad = ["qdp-desktop/gamepad"]
# Shows the host's pairing codes as desktop notifications.
notifications = ["qdp-desktop/notifications"]
# Captures the host's screen; without it, hosts stream a test pattern.
screen-capture = ["qdp-desktop/screen-capture"]
# Shows the stream in a window. Without it, `qdp connect` runs headless only,
# for hosts and servers that need no windowing libraries.
window = ["dep:softbuffer", "dep:winit", "qdp-app/winit", "tokio/sync", "tokio/time"]

[dependencies]
qdp.workspace = true
qdp-app.workspace = true
qdp-codec.workspace = true
qdp-desktop.workspace = true
qdp-quic.workspace = true
qdp-runtime.workspace = true
rpassword.workspace = true
softbuffer = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
winit = { workspace = true, optional = true }

[lints]
workspace = true
