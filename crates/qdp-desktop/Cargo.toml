[package]
name = "qdp-desktop"
description = "Desktop integration for Quick Desktop Protocol (QDP) hosts: input injection and screen capture on each operating system"
readme = "../../README.md"
keywords = ["remote-desktop", "input", "screen-capture"]
categories = ["os"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["audio", "gamepad", "screen-capture"]
# Plays and captures audio: through PipeWire on Linux, which needs PipeWire's
# development files and libclang to build, and through cpal elsewhere.
audio = ["dep:cpal", "dep:pipewire"]
# Captures the client's gamepads. On Linux it needs libudev's development
# files to build.
gamepad = ["dep:gilrs"]
# Captures the screen on Linux through the ScreenCast portal and PipeWire.
# Building it needs PipeWire's development files and libclang.
screen-capture = [
    "dep:ashpd",
    "dep:pipewire",
    "dep:tokio",
    "dep:wayland-client",
    "dep:wayland-protocols-plasma",
]

[dependencies]
arboard.workspace = true
gilrs = { workspace = true, optional = true }
qdp.workspace = true
qdp-codec.workspace = true
qdp-runtime.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
ashpd = { workspace = true, optional = true }
libc.workspace = true
pipewire = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
wayland-client = { workspace = true, optional = true }
wayland-protocols-plasma = { workspace = true, optional = true }
wl-clipboard-rs.workspace = true
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[lints]
workspace = true
