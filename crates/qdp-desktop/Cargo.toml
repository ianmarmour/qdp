[package]
name = "qdp-desktop"
description = "Desktop integration for Quick Desktop Protocol (QDP) hosts: input injection and screen capture on each operating system"
readme = "../../README.md"
keywords = ["remote-desktop", "input", "screen-capture"]
categories = ["os"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["audio", "discovery", "gamepad", "notifications", "screen-capture"]
# Plays and captures audio: through PipeWire on Linux, which needs PipeWire's
# development files and libclang to build, and through cpal elsewhere,
# AAudio on Android.
audio = ["dep:cpal", "dep:pipewire"]
# Advertises the host on the local network (Section 3.13): through Avahi on
# Linux.
discovery = ["dep:futures-lite", "dep:tokio", "dep:zbus"]
# Shows desktop notifications, such as pairing codes: through the
# freedesktop notification service on Linux.
notifications = ["dep:tokio", "dep:zbus"]
# Captures the client's gamepads. On Linux it needs libudev's development
# files to build.
gamepad = ["dep:gilrs"]
# Captures the screen on Linux through the ScreenCast portal and PipeWire.
# Building it needs PipeWire's development files and libclang.
screen-capture = [
    "dep:ashpd",
    "dep:pipewire",
    "dep:tokio",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-scanner",
    "dep:bitflags",
    "dep:wayland-protocols-wlr",
]

[dependencies]
gilrs = { workspace = true, optional = true }
qdp.workspace = true
qdp-codec.workspace = true
qdp-runtime.workspace = true
tracing.workspace = true

# Android and iOS have no clipboard arboard reaches.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }
ashpd = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
libc.workspace = true
pipewire = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "sync"] }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-scanner = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
wl-clipboard-rs.workspace = true
x11rb.workspace = true
zbus = { workspace = true, optional = true }

# Metal drawing, on Macs and iOS devices.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2-app-kit.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-media.workspace = true
objc2-screen-capture-kit.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", windows, target_os = "android"))'.dependencies]
cpal = { workspace = true, optional = true }

# On Android, cpal's real-time feature opens AAudio streams in their
# low-latency mode, which takes a few milliseconds a callback rather than the
# 20 to 40 ms of the normal path, each of which the jitter buffer holds.
[target.'cfg(target_os = "android")'.dependencies]
cpal = { workspace = true, optional = true, features = ["realtime"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[lints]
workspace = true
