[package]
name = "qdp-gateway"
description = "The QDP gateway: authenticates users against an organization's directory with a TOTP second factor, and tunnels their QDP sessions to hosts inside its network"
readme = "../../README.md"
keywords = ["remote-desktop", "gateway", "ldap", "totp"]
categories = ["network-programming", "authentication"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
